name: remind

# Mails the players who have not picked, in the last twelve hours before the
# lock -- so the mail lands on Saturday afternoon rather than overnight.
#
# Started on time by a Cloudflare Worker (cron/), at noon Central on Saturday.
# GitHub's own schedule below is best-effort -- on 19 September 2026 it skipped
# both the noon and 1pm runs -- so it stays only as a fallback. Either trigger
# is harmless if the other already ran: an already-reminded player is skipped.
#
# Hourly on Saturdays rather than a single timed run, because the cron field is
# UTC and the deadline is 11:59pm Central. America/Chicago is UTC-5 until 1
# November 2026 and UTC-6 after it, so any fixed UTC hour is an hour wrong for
# the back half of the season. bin/remind.php decides whether it is really the
# window, in the pool's own timezone, and does nothing on the runs that are not.
#
# Sending twelve times is safe: every reminder is recorded per player and week,
# and an already-reminded player is skipped.
on:
  schedule:
    # Every hour on Saturday, UTC. Most of these report "not the send window"
    # and exit; that is the point. The window opens at noon Central, which is
    # 17:00 UTC in daylight time and 18:00 UTC in standard time -- the hour
    # that moves, and the reason the decision is not in this cron field.
    - cron: '0 * * * 6'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'List who would be mailed, send nothing'
        type: boolean
        default: true

concurrency:
  group: remind
  cancel-in-progress: false

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master

      # The app scales to zero and `fly ssh console` cannot reach a stopped
      # machine. Same reason as the backup job: without this, the run fails on
      # any hour nobody happened to visit the site.
      - name: Wake the machine
        run: curl -sS --max-time 60 -o /dev/null https://loser-pool-2026.fly.dev/health.php

      - name: Send reminders
        run: |
          FLAGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then FLAGS="--dry-run"; fi
          flyctl ssh console --app loser-pool-2026 \
            -C "php /var/www/bin/remind.php $FLAGS" | tee out.txt
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      # This repository is public and these logs are public with it. The job
      # prints usernames and counts; bin/remind.php never prints an address.
      - name: Confirm it said something we recognise
        run: grep -qE 'Not the send window|reminded|Nothing to (send|do|remind)|no pickable teams' out.txt

      # The run above can exit non-zero without failing the job (the pipe into
      # tee hides it), so the one failure the commissioner would otherwise never
      # hear about -- their own summary not arriving -- is checked by name.
      - name: Confirm the commissioner got the list
        run: "! grep -q 'Could not mail the commissioner' out.txt"
