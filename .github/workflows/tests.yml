name: tests

# Also runs on a schedule, with nothing pushed.
#
# The suite went red on 15 September 2026 without a commit behind it. Several
# season tests answered "is registration open?" against the real wall clock,
# and lp_registration_is_open() short-circuits to true for as long as
# lp_season_in_progress() is false -- so every run before 8 September passed
# without ever reaching the rule it was meant to be testing. The last push was
# in August, so the last green tick stayed on master, and by the time the code
# was wrong the pipeline had stopped looking.
#
# A daily run is what makes the tick mean "passing today" rather than "passed
# whenever someone last pushed". Season rules are dated by nature: they will rot
# on a calendar boundary again, and that should arrive as a failed job rather
# than as a player noticing.
on:
  push:
    branches: [master]
  pull_request:
  workflow_call:
  workflow_dispatch:
  schedule:
    # 13:00 UTC daily, an hour before the health check, so a rules failure and
    # a site failure land in the same morning's mail.
    - cron: '0 13 * * *'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 7.4 is the floor the production host is assumed to support: the
        # pre-existing code uses typed properties but nothing newer, and the
        # host's version is unknown. Newer versions guard against rot.
        php: ['7.4', '8.1', '8.3']

    name: PHP ${{ matrix.php }}
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: json, curl
          coverage: none

      # Catches syntax that would fatal on the oldest supported runtime.
      - name: Lint every PHP file
        run: |
          status=0
          while IFS= read -r file; do
            php -l "$file" > /dev/null || { echo "Syntax error in $file"; status=1; }
          done < <(find htdocs tests bin -name '*.php')
          exit $status

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Run test suite
        run: vendor/bin/phpunit --colors=never
